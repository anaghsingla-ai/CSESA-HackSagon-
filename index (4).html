<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Board - RPG Task Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <header>
            <div class="header-content">
                <h1>
                    <span>⚔️</span>
                    Quest Board
                </h1>
                <div class="player-stats">
                    <div class="level-display">
                        Level <span id="playerLevel">1</span>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">XP Progress</div>
                        <div class="xp-bar-container">
                            <div class="xp-bar" id="xpBar"></div>
                            <div class="xp-text" id="xpText">0 / 100</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Total XP</div>
                        <div class="stat-value" id="totalXP">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Quests Done</div>
                        <div class="stat-value" id="questsCompleted">0</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="add-task-section">
            <div class="task-input-group">
                <input type="text" id="taskTitle" placeholder="Quest Name (e.g., Complete Math Assignment)">
                <input type="text" id="taskDescription" placeholder="Quest Details (optional)">
                <select id="taskPriority">
                    <option value="low">Low Priority (10 XP)</option>
                    <option value="medium" selected>Medium Priority (25 XP)</option>
                    <option value="high">High Priority (50 XP)</option>
                </select>
                <button onclick="addTask()">➕ Add Quest</button>
            </div>
        </div>

        <div class="kanban-board">
            <div class="kanban-column todo-column">
                <div class="column-header">
                    <h2>📋 To-Do</h2>
                    <span class="task-count" id="todoCount">0</span>
                </div>
                <div class="task-list" id="todoList" ondrop="drop(event, 'todo')" ondragover="allowDrop(event)">
                    <div class="empty-state">
                        <div class="empty-state-icon">🎯</div>
                        <p>No quests yet. Start your adventure!</p>
                    </div>
                </div>
            </div>

            <div class="kanban-column progress-column">
                <div class="column-header">
                    <h2>⚡ In Progress</h2>
                    <span class="task-count" id="progressCount">0</span>
                </div>
                <div class="task-list" id="progressList" ondrop="drop(event, 'progress')" ondragover="allowDrop(event)">
                    <div class="empty-state">
                        <div class="empty-state-icon">🔥</div>
                        <p>Drag quests here when you start them</p>
                    </div>
                </div>
            </div>

            <div class="kanban-column completed-column">
                <div class="column-header">
                    <h2>✅ Completed</h2>
                    <span class="task-count" id="completedCount">0</span>
                </div>
                <div class="task-list" id="completedList" ondrop="drop(event, 'completed')" ondragover="allowDrop(event)">
                    <div class="empty-state">
                        <div class="empty-state-icon">🏆</div>
                        <p>Complete quests to earn XP!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
